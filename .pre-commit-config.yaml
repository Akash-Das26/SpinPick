# Pre-commit hook configuration.
#
# Install once (Python 3.7+):
#   pip install pre-commit
#   pre-commit install
#
# From then on, gitleaks runs before every `git commit`, scanning only the
# staged changes (fast) using the same allowlist as CI (.gitleaks.toml).
# A local `validate-docs` hook also runs on every commit, keeping the
# GITHUB_PUSH_GUIDE.md code fences balanced and docker-compose.yml valid YAML
# (see scripts/validate_docs.py), so future docs edits can't break the guide.
# To skip temporarily (e.g. WIP commit):  git commit --no-verify
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  # Local hooks — no network fetch, cheap always-on guards.
  - repo: local
    hooks:
      - id: validate-docs
        name: validate GITHUB_PUSH_GUIDE.md fences + docker-compose.yml YAML
        entry: python scripts/validate_docs.py
        language: python
        additional_dependencies: [PyYAML]
        always_run: true
        pass_filenames: false
