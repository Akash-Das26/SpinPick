name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (for Storybook unit tests)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        # Proxy security behavior (origin allow-list + token gate) is regression-tested
        # right here via `npm run test:unit`:
        #   - mocked-handler suite: tests/unit/proxy.test.mjs + aiService.proxy.test.mjs
        #     (origin allow-list 403, PROXY_AUTH_TOKEN gate 401 + WWW-Authenticate: Bearer,
        #     rate limiting 429, health/OPTIONS exemptions, proxy-vs-offline routing)
        #   - HTTP-level integration suite: tests/unit/proxy.http.test.mjs — boots the
        #     real server on an ephemeral port and drives the same gates with real fetch
        #   - Storybook tests: src/stories/*.stories.ts (requires Playwright Chromium)
        run: npm run test:unit

      - name: Build production
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks (pinned v8.18.2, checksum-verified)
        run: |
          curl -sSfL -o gitleaks_8.18.2_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          curl -sSfL -o gitleaks_8.18.2_checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_checksums.txt
          grep 'gitleaks_8.18.2_linux_x64.tar.gz' gitleaks_8.18.2_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run gitleaks secret scan (full history)
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  validate-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install XML tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Validate SEO assets
        run: |
          echo "🔍 Validating robots.txt..."
          test -f public/robots.txt || { echo "❌ robots.txt missing"; exit 1; }
          grep -q "User-agent:" public/robots.txt || { echo "❌ robots.txt missing User-agent"; exit 1; }
          grep -q "Sitemap:" public/robots.txt || { echo "❌ robots.txt missing Sitemap reference"; exit 1; }
          echo "✅ robots.txt valid"

          echo "🔍 Validating sitemap.xml..."
          test -f public/sitemap.xml || { echo "❌ sitemap.xml missing"; exit 1; }
          xmllint --noout public/sitemap.xml || { echo "❌ sitemap.xml malformed"; exit 1; }
          grep -q "https://spinpick.app/" public/sitemap.xml || { echo "❌ sitemap.xml missing homepage URL"; exit 1; }
          grep -q "https://spinpick.app/compare" public/sitemap.xml || { echo "❌ sitemap.xml missing compare page URL"; exit 1; }
          echo "✅ sitemap.xml valid"

          echo "🔍 Validating manifest.json..."
          test -f public/manifest.json || { echo "❌ manifest.json missing"; exit 1; }
          node -e "
            const m = JSON.parse(require('fs').readFileSync('public/manifest.json', 'utf8'));
            const required = ['name', 'short_name', 'start_url', 'display', 'icons'];
            for (const field of required) {
              if (!m[field]) { console.error('❌ manifest.json missing field:', field); process.exit(1); }
            }
          " || exit 1
          echo "✅ manifest.json valid"

          echo "✅ All SEO validations passed"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (CI runner)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: |
          # Boot the dev server on 5173 (the e2e runner navigates to BASE_URL)
          npx vite --port 5173 --strictPort > /tmp/vite-e2e.log 2>&1 &
          VITE_PID=$!
          # Wait for the server to become ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ | grep -q 200; then
              echo "dev server ready"
              break
            fi
            sleep 1
          done
          npm run test:e2e
          EXIT_CODE=$?
          kill $VITE_PID 2>/dev/null || true
          exit $EXIT_CODE
        env:
          BASE_URL: http://localhost:5173

  proxy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      # server/proxy.mjs is zero-dependency (Node built-ins only), so no npm
      # install is needed — the smoke script starts its own isolated proxy.
      # Proxy behavior is regression-tested in two places:
      #   1. Unit: the lint-and-test job's `npm run test:unit` step regression-tests
      #      proxy security — 36 mocked-handler tests in proxy.test.mjs (origin
      #      allow-list, token gate, rate limit, WWW-Authenticate: Bearer, health/
      #      OPTIONS exemptions) + 14 HTTP-level tests in proxy.http.test.mjs (real
      #      server on an ephemeral port, real fetch) + the proxy-routing suite in
      #      aiService.proxy.test.mjs (fallback).
      #   2. Integration: this matrix exercises the live gates end-to-end with curl
      #      (health 200, preflight 204, evil origin 403, token 401s, 429 rate limit).
      - name: Proxy security-matrix smoke test
        run: bash scripts/proxy-smoke.sh

  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [lint-and-test, validate-seo, secret-scan, proxy-smoke, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    environment: preview
    steps:
      - name: Deploy to preview
        run: echo "Deploy preview URL would be generated here"
