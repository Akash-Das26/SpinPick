name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        # Proxy security behavior (origin allow-list + token gate) is regression-tested
        # right here via `npm run test:unit`:
        #   - mocked-handler suite: tests/unit/proxy.test.mjs + aiService.proxy.test.mjs
        #     (origin allow-list 403, PROXY_AUTH_TOKEN gate 401 + WWW-Authenticate: Bearer,
        #     rate limiting 429, health/OPTIONS exemptions, proxy-vs-offline routing)
        #   - HTTP-level integration suite: tests/unit/proxy.http.test.mjs — boots the
        #     real server on an ephemeral port and drives the same gates with real fetch
        run: npm run test:unit

      - name: Build production
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks (pinned v8.18.2, checksum-verified)
        run: |
          curl -sSfL -o gitleaks_8.18.2_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          curl -sSfL -o gitleaks_8.18.2_checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_checksums.txt
          grep 'gitleaks_8.18.2_linux_x64.tar.gz' gitleaks_8.18.2_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run gitleaks secret scan (full history)
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  validate-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate robots.txt exists
        run: |
          if [ ! -f public/robots.txt ]; then
            echo "❌ robots.txt missing"
            exit 1
          fi
          echo "✅ robots.txt exists"

      - name: Validate robots.txt content
        run: |
          if ! grep -q "User-agent:" public/robots.txt; then
            echo "❌ robots.txt missing User-agent"
            exit 1
          fi
          if ! grep -q "Sitemap:" public/robots.txt; then
            echo "❌ robots.txt missing Sitemap reference"
            exit 1
          fi
          echo "✅ robots.txt content valid"

      - name: Validate sitemap.xml exists
        run: |
          if [ ! -f public/sitemap.xml ]; then
            echo "❌ sitemap.xml missing"
            exit 1
          fi
          echo "✅ sitemap.xml exists"

      - name: Validate sitemap.xml is well-formed XML
        run: |
          xmllint --noout public/sitemap.xml
          echo "✅ sitemap.xml is well-formed"

      - name: Validate sitemap.xml has required URLs
        run: |
          if ! grep -q "https://spinpick.app/" public/sitemap.xml; then
            echo "❌ sitemap.xml missing homepage URL"
            exit 1
          fi
          if ! grep -q "https://spinpick.app/compare" public/sitemap.xml; then
            echo "❌ sitemap.xml missing compare page URL"
            exit 1
          fi
          echo "✅ sitemap.xml has required URLs"

      - name: Validate manifest.json exists
        run: |
          if [ ! -f public/manifest.json ]; then
            echo "❌ manifest.json missing"
            exit 1
          fi
          echo "✅ manifest.json exists"

      - name: Validate manifest.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.json', 'utf8'))"
          echo "✅ manifest.json is valid JSON"

      - name: Validate manifest.json has required fields
        run: |
          node -e "
            const m = require('./public/manifest.json');
            const required = ['name', 'short_name', 'start_url', 'display', 'icons'];
            for (const field of required) {
              if (!m[field]) {
                console.error('❌ manifest.json missing field:', field);
                process.exit(1);
              }
            }
            console.log('✅ manifest.json has required fields');
          "

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (CI runner)
        # npm ci does NOT download Playwright browsers since v1.38; the e2e
        # runner uses Playwright's bundled Chromium when CI is set.
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5173

  proxy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      # server/proxy.mjs is zero-dependency (Node built-ins only), so no npm
      # install is needed — the smoke script starts its own isolated proxy.
      # Proxy behavior is regression-tested in two places:
      #   1. Unit: the lint-and-test job's `npm run test:unit` step regression-tests
      #      proxy security — 36 mocked-handler tests in proxy.test.mjs (origin
      #      allow-list, token gate, rate limit, WWW-Authenticate: Bearer, health/
      #      OPTIONS exemptions) + 14 HTTP-level tests in proxy.http.test.mjs (real
      #      server on an ephemeral port, real fetch) + the proxy-routing suite in
      #      aiService.proxy.test.mjs (fallback).
      #   2. Integration: this matrix exercises the live gates end-to-end with curl
      #      (health 200, preflight 204, evil origin 403, token 401s, 429 rate limit).
      - name: Proxy security-matrix smoke test
        run: bash scripts/proxy-smoke.sh

  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [lint-and-test, validate-seo, secret-scan, proxy-smoke, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    environment: preview
    steps:
      - name: Deploy to preview
        run: echo "Deploy preview URL would be generated here"